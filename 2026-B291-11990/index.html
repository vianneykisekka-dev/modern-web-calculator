<!DOCTYPE html>
<html>
<head>
    <title>Modern Web Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="calculator">

    <div class="display">0</div>

    <div class="buttons">

        <button class="light">AC</button>
        <button>00</button>
        <button>%</button>
        <button class="symbol">&divide;</button>

        <button>7</button>
        <button>8</button>
        <button>9</button>
        <button class="symbol">&times;</button>

        <button>4</button>
        <button>5</button>
        <button>6</button>
        <button class="symbol">&minus;</button>

        <button>1</button>
        <button>2</button>
        <button>3</button>
        <button class="symbol">&plus;</button>

        <button class="zero">0</button>
        <button>.</button>
        <button class="symbol">=</button>
    </div>
</div>

</body>
</html>
